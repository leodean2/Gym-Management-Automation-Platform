name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymrocks
          POSTGRES_PASSWORD: gymrocks_ci_password
          POSTGRES_DB: gymrocks_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A fresh, empty Postgres per run — every migration must apply
      # cleanly from scratch, which is itself a useful check that our
      # migration history is complete and not silently relying on
      # hand-applied SQL that was never actually captured.
      DATABASE_URL: postgresql://gymrocks:gymrocks_ci_password@localhost:5432/gymrocks_ci
      DIRECT_URL: postgresql://gymrocks:gymrocks_ci_password@localhost:5432/gymrocks_ci
      TEST_DATABASE_URL: postgresql://gymrocks:gymrocks_ci_password@localhost:5432/gymrocks_ci
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRES_IN: 8h
      BCRYPT_COST_FACTOR: 4
      LOGIN_MAX_FAILED_ATTEMPTS: 5
      LOGIN_LOCKOUT_MINUTES: 15
      PASSWORD_RESET_TOKEN_TTL_MINUTES: 60
      RATE_LIMIT_WINDOW_MINUTES: 15
      RATE_LIMIT_MAX_REQUESTS: 1000
      LOGIN_RATE_LIMIT_MAX_REQUESTS: 1000
      INQUIRY_RATE_LIMIT_MAX_REQUESTS: 1000
      MEMBERSHIP_PAYMENT_WINDOW_HOURS: 48
      NOTIFICATION_FROM_EMAIL: no-reply@gymrocksfitness.com
      CLIENT_ORIGIN: http://localhost:5173

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Apply manual SQL (btree_gist extension + booking exclusion constraint)
        run: |
          PGPASSWORD=gymrocks_ci_password psql -h localhost -U gymrocks -d gymrocks_ci -c "
            CREATE EXTENSION IF NOT EXISTS btree_gist;
            ALTER TABLE bookings ADD CONSTRAINT bookings_no_overlap
              EXCLUDE USING gist (
                trainer_id WITH =,
                tsrange(booking_date + start_time, booking_date + end_time) WITH &&
              ) WHERE (status = 'Scheduled');
          "

      - name: Run tests
        run: npm test
